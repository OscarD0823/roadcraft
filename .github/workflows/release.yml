name: Publicar versión

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Validar proyecto
        run: npm run check

      - name: Validar límites del lector TPL
        run: npm run test:tpl

      - name: Validar ensamblado y maquinaria fija
        run: npm run test:appearance

      - name: Validar pintura de empresa y conservación de partidas
        run: npm run test:paint

      - name: Validar convoyes logísticos
        run: npm run test:logistics

      - name: Validar carga de arena, copia y restauración
        run: npm run test:sand

      - name: Crear instalador
        run: npm run make

      - name: Publicar archivos
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            out/make/squirrel.windows/x64/*.exe
            out/make/squirrel.windows/x64/*.nupkg
            out/make/squirrel.windows/x64/RELEASES
